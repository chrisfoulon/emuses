[pytest]
asyncio_default_fixture_loop_scope = function
# `-m "not extras"` deselects the parked features (marketplace, cloud/database
# registry, multi-user service). They are deselected, not skipped or deleted:
# `pytest -m extras` runs them. See tests/extras/conftest.py and
# tests/test_architecture_boundary.py.
addopts = 
    --tb=short
    --strict-markers
    -v
    -m "not extras"
asyncio_mode = strict

# Global safety net. A test that blocks forever used to run forever: an orphaned
# test_performance_stress.py run from 2026-07-31 was found still stuck in epoll after
# 6 days 11 hours. Generous enough that no legitimate test trips it (the slowest, the
# session pipeline fixture, is ~55s), tight enough that a wedged run fails the same day.
timeout = 600
# signal, not thread. The thread method cannot interrupt a stuck test, so it dumps
# stacks and kills the whole process - one hanging test then aborts the entire run
# and no other result is ever reported. That happened on 2026-08-19: the suite died
# at 27% on test_concurrent_job_submissions and the core failure count could not be
# measured at all. signal (SIGALRM) interrupts the test and lets the run continue.
# The trade-off is real: SIGALRM only fires on the main thread and cannot interrupt
# a block inside a C extension. A hang of that kind will still need the thread
# method to diagnose - but losing every other result by default costs more.
timeout_method = signal

markers =
    asyncio: Async tests
    compatibility: Compatibility tests for basic imports
    integration: Integration tests requiring full setup
    slow: Tests that take a long time to run
    performance: Performance and optimization tests
    extras: Parked features (marketplace, cloud/database registry, multi-user service).
        Excluded from the default run. Applied automatically to everything under
        tests/extras/ by that directory's conftest.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
