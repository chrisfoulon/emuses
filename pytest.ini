[pytest]
asyncio_default_fixture_loop_scope = function
addopts = 
    --tb=short
    --strict-markers
    -v
asyncio_mode = strict

# Global safety net. A test that blocks forever used to run forever: an orphaned
# test_performance_stress.py run from 2026-07-31 was found still stuck in epoll after
# 6 days 11 hours. Generous enough that no legitimate test trips it (the slowest, the
# session pipeline fixture, is ~55s), tight enough that a wedged run fails the same day.
# thread method rather than signal: signal cannot interrupt a block inside C code.
timeout = 600
timeout_method = thread

markers =
    asyncio: Async tests
    compatibility: Compatibility tests for basic imports
    integration: Integration tests requiring full setup
    slow: Tests that take a long time to run
    performance: Performance and optimization tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
