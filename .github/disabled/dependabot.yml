version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "maintainer-team"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # Ignore CUDA packages that need careful coordination
      - dependency-name: "nvidia-*"
      # Ignore major version updates for scientific packages that need validation
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "scikit-learn"
        update-types: ["version-update:semver-major"]