name: Development CI - Core Contract

# This is the gate that decides whether a PR is safe to merge. It runs the CORE
# CONTRACT -- the suites that must stay green, defined once in
# scripts/dev_test_runner.py so this file and the local pre-push command cannot
# disagree about what "green" means.
#
# It is deliberately NOT the whole suite. ~59 failures live outside the contract
# (tests/model_registry, tests/cli, tests/foundation_fastapi_service, tests/security);
# they are real, they are tracked in STATUS.md, and they do not touch the pipeline.
# ci.yml sweeps them on main without gating, so they stay visible. Gating on them
# instead would mean every push is red, which is the same as having no gate at all.
#
# Pull requests only. A `push` trigger alongside this ran the workflow twice for every
# push to a branch with an open PR. Deduplicating them via a concurrency group works, but
# leaves the cancelled run showing as a failed check on the PR (mergeStateStatus
# UNSTABLE) and still costs a runner start. Not triggering it at all is cleaner and
# cheaper.
#
# Branches with no open PR get no run here by design: the pre-push gate for those is
# `python scripts/dev_test_runner.py` locally, which is the workflow CLAUDE.md already
# describes. Use workflow_dispatch to run this against a branch on demand.
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Two things, both about not paying twice for the same answer:
#
# The key must collapse the push and pull_request events for a branch into ONE group.
# That needs `ref_name`, not `ref`, as the fallback: on push, `head_ref` is empty and
# `github.ref` expands to `refs/heads/<branch>`, while a pull_request gives the bare
# `<branch>` — different strings, different groups, and both runs proceed. `ref_name` is
# the bare branch name for push events, so the two events land in the same group and the
# second supersedes the first. (Keying on `ref` was tried and demonstrably did not
# dedupe: runs 30621762849 and 30621765690 both ran for the same commit.)
#
# cancel-in-progress then supersedes queued runs when a branch is pushed again, so
# iterating does not leave a trail of runs whose results nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    # The core contract measures 4 m 24 s locally, of which tests/regression is 132 s,
    # and 6 m 39 s on a hosted runner (measured 2026-09-06, run 34053559752). 15 gives
    # honest room for a slower runner without letting a hang burn the budget.
    #
    # It grew from 3 m 32 s / 91 s when tests/regression gained a third dataset on
    # 2026-09-06. Note --foreign-machine does NOT save that time: it deselects the value
    # comparisons, but `regression_results` is session-scoped and
    # test_pipeline_produces_the_expected_outputs is deliberately not machine_specific,
    # so every dataset's pipeline still runs here. That is the point -- a gate that
    # deselected its way to not executing the pipeline would be checking nothing.
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.11

    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-dev-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-dev-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # This used to install with --no-deps and no scientific stack, so the gate
        # could only ever run one test file that imports nothing heavy. That made it
        # fast and almost meaningless: it would not have caught any defect found in
        # the last month of work, all of which lived in the pipeline. The core
        # contract needs the real stack.
        pip install --no-deps -r requirements.txt
        pip install --no-deps -e .

    - name: Core contract
      run: |
        # The same command developers run before pushing, reading its suite list from
        # scripts/dev_test_runner.py so the local gate and this one cannot disagree.
        python scripts/dev_test_runner.py --core --foreign-machine
