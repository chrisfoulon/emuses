name: Development CI - Fast Tests

on: 
  push:
    branches-ignore: [main, master]  # Only run on development branches
  pull_request:
    branches: [main, master]

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # Strict time limit for cost control

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-dev-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-dev-

    - name: Install minimal dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-xdist pytest-asyncio
        # Install core dependencies needed for parallelism tests
        pip install joblib numpy scikit-learn
        pip install -e . --no-deps  # Skip heavy dependencies for fast tests

    - name: Run fast development tests
      run: |
        # Run only the most reliable, fast tests for development feedback
        # These tests should complete in under 1 minute and use minimal resources
        pytest tests/tools/test_parallelism_utils.py -v --maxfail=2 -x --tb=short
        
    - name: Syntax and Import Check
      run: |
        # Quick syntax validation - very fast, catches basic issues
        python -m py_compile emuses/cli/main.py emuses/tools/parallelism_utils.py emuses/__init__.py
