version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emuses-api
    restart: unless-stopped
    environment:
      - EMUSES_DEPLOYMENT_MODE=production
      - DATABASE_URL=postgresql+asyncpg://emuses_user:${POSTGRES_PASSWORD}@postgres:5432/emuses_db
      - JWT_SECRET=${JWT_SECRET}
      - EMUSES_SERVICE_HOST=0.0.0.0
      - EMUSES_SERVICE_PORT=8000
      - EMUSES_STORAGE_ROOT=/app/storage
      - EMUSES_MAX_WORKERS=4
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - emuses-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: emuses-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=emuses_db
      - POSTGRES_USER=emuses_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - emuses-network
    ports:
      - "5433:5432"  # Expose on non-standard port to avoid conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emuses_user -d emuses_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.25-alpine
    container_name: emuses-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - emuses-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  emuses-network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24