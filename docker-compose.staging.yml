version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: staging
    container_name: emuses-api-staging
    restart: unless-stopped
    environment:
      - EMUSES_DEPLOYMENT_MODE=staging
      - DATABASE_URL=postgresql+asyncpg://emuses_user:${POSTGRES_PASSWORD}@postgres:5432/emuses_db_staging
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - JWT_SECRET=${JWT_SECRET}
      - EMUSES_SERVICE_HOST=0.0.0.0
      - EMUSES_SERVICE_PORT=8000
      - EMUSES_STORAGE_ROOT=/app/storage
      - EMUSES_MAX_WORKERS=4
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - SSL_CERT_PATH=${SSL_CERT_PATH}
      - SSL_KEY_PATH=${SSL_KEY_PATH}
      - LOG_LEVEL=DEBUG
    volumes:
      - model_storage_staging:/app/storage
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emuses-staging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/registry/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: emuses-postgres-staging
    restart: unless-stopped
    environment:
      - POSTGRES_DB=emuses_db_staging
      - POSTGRES_USER=emuses_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - emuses-staging
    ports:
      - "5434:5432"  # Different port for staging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emuses_user -d emuses_db_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: emuses-redis-staging
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data_staging:/data
    networks:
      - emuses-staging
    ports:
      - "6380:6379"  # Different port for staging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.15'
        reservations:
          memory: 128M
          cpus: '0.05'
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: emuses-nginx-staging
    restart: unless-stopped
    ports:
      - "8080:80"    # Different port for staging
      - "8443:443"   # Different port for staging
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - emuses-staging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
        reservations:
          memory: 64M
          cpus: '0.05'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/registry/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_staging:
    driver: local
  redis_data_staging:
    driver: local
  model_storage_staging:
    driver: local

networks:
  emuses-staging:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.201.0/24